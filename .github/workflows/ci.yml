name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            langgraph_agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r langgraph_agent/requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s tests

      - name: Run CI triage agent tests
        working-directory: langgraph_agent
        run: python -m pytest -q
